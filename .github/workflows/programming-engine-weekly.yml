# Programming engine: weekly batch — normalize, exclusions, generate programs.
# Runs every Monday 09:00 UTC (= Monday 7:00pm AEST) or on demand.
# Add secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (repo Settings → Secrets and variables → Actions).

name: Programming engine weekly

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Normalize all members
        run: python tools/normalize_one_member.py

      - name: Apply auto-exclusions from feedback
        run: python tools/apply_auto_exclusions.py

      - name: Generate programs for due members
        run: python tools/run_weekly_batch.py
